name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # WPF só compila no Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build ClaudeWatch.slnx -c Release
      - run: dotnet test ClaudeWatch.slnx -c Release --no-build
